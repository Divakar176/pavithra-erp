services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Java Spring Boot)
  # -------------------------------------------------------------
  - type: web
    name: pavithra-erp-backend-live
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore # Change to your preferred region (singapore, frankfurt, oregon)
    plan: starter # Set to 'starter' ($7/mo) for 24/7 Enterprise uptime (no sleeping), or 'free'
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_DRIVER
        value: org.h2.Driver
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:./data/pavithradb;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: pavithra-erp-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
