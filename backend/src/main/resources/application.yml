spring:
  datasource:
    # Do NOT change these three lines. Leave them exactly as ${...}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pavithra_erp_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: your_company_email@gmail.com
    password: your_google_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
